<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Task List</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light py-5">


    <div class="container" style="max-width: 550px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            
            <h2 class="h4 fw-bold text-dark mb-1">Study Sprint Tasks</h2>
            <p class="text-muted small mb-4">Add and manage active programming milestones.</p>


            <!-- Input & Add Form -->
            <form id="taskForm" class="d-flex gap-2 mb-4">
                <input type="text" class="form-control" id="taskInput" placeholder="e.g., Build Django Model..." required>
                <button type="submit" class="btn btn-primary d-flex align-items-center gap-1 text-nowrap">
                    <i class="bi bi-plus-lg"></i>
                    <span>Add Task</span>
                </button>
            </form>


            <!-- Target Container for Dynamic Items -->
            <ul class="list-group list-group-flush border rounded-3" id="taskList">
                <!-- Dynamic tasks generated by JavaScript will appear here -->
            </ul>


            <!-- Empty State Notice -->
            <div id="emptyNotice" class="text-center text-muted small py-4">
                No tasks yet. Type an item above and hit "Add Task"!
            </div>


            <div class="d-flex justify-content-between align-items-center mt-3 pt-2">
                <span class="text-muted small" id="taskCounter">Total items: 0</span>
                <button type="button" class="btn btn-outline-danger btn-sm" id="clearAllBtn">Clear All</button>
            </div>


        </div>
    </div>


    <script src="app.js"></script>
</body>
</html>
